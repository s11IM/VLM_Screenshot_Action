[package]
name = "desktop-automation-core"
version = "0.1.0"
edition = "2021"
description = "Interruptible Windows desktop input and normalized coordinate primitives"
license = "MIT"
publish = false
repository = "https://github.com/s11IM/VLM_Screenshot_Action"

[dependencies]
enigo = "0.6.1"
serde = { version = "1", features = ["derive"] }
xcap = "0.9.7"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Win32_UI_HiDpi", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse"] }
